server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API and the SPA are served from the same origin, so the browser never
    # makes a cross-origin request and no CORS policy is needed in the demo.
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Refund decisions call an LLM. Do not let nginx cut the response short.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Refund request bodies are small; cap them well below the PDF upload limit.
        client_max_body_size 10m;
    }

    # Hashed assets are immutable - cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # TanStack Router owns client-side routing: every unknown path returns the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
